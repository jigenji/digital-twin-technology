# =============================================================================
# OpenTwin Scenario: Factory Equipment Monitoring
# Same universal primitives, completely different domain
# =============================================================================

object_types:
  - type_id: cnc_machine
    display_name: CNC Machine
    primary_key: machine_id
    tags: [stationary, manufacturing, monitored]
    properties:
      - name: machine_id
        type: string
      - name: name
        type: string
      - name: status
        type: string
        constraint:
          enum_values: [running, idle, maintenance, error, offline]
        default_value: idle
      - name: spindle_speed
        type: float
        unit: rpm
      - name: spindle_load
        type: float
        unit: "%"
      - name: feed_rate
        type: float
        unit: mm/min
      - name: temperature
        type: float
        unit: "°C"
      - name: vibration_rms
        type: float
        unit: mm/s
      - name: power_consumption
        type: float
        unit: kW
      - name: operating_hours
        type: float
        unit: h
      - name: pose
        type: geo_pose
        spatial:
          coordinate_frame: factory_floor
      - name: model_3d
        type: mesh
        spatial:
          format: gltf
          storage: ref
      - name: current_program
        type: string

  - type_id: conveyor
    display_name: Conveyor Belt
    primary_key: conveyor_id
    tags: [stationary, transport]
    properties:
      - name: conveyor_id
        type: string
      - name: name
        type: string
      - name: status
        type: string
        constraint:
          enum_values: [running, stopped, error]
      - name: speed
        type: float
        unit: m/s
      - name: items_count
        type: int
      - name: model_3d
        type: mesh
        spatial:
          format: gltf
          storage: ref

  - type_id: agv
    display_name: Automated Guided Vehicle
    primary_key: agv_id
    tags: [autonomous, mobile, indoor]
    properties:
      - name: agv_id
        type: string
      - name: name
        type: string
      - name: status
        type: string
        constraint:
          enum_values: [idle, transporting, charging, error]
        default_value: idle
      - name: battery_level
        type: float
        unit: "%"
      - name: payload_kg
        type: float
        unit: kg
      - name: pose
        type: geo_pose
        spatial:
          coordinate_frame: factory_floor
      - name: lidar_scan
        type: pointcloud
        spatial:
          format: pcd
          coordinate_frame: base_link
          storage: ref
      - name: map
        type: occupancy_grid
        spatial:
          format: pgm
          coordinate_frame: factory_floor
          resolution: 0.05
          storage: ref

  - type_id: factory_zone
    display_name: Factory Zone
    primary_key: zone_id
    tags: [spatial, area]
    properties:
      - name: zone_id
        type: string
      - name: name
        type: string
      - name: zone_type
        type: string
        constraint:
          enum_values: [production, assembly, warehouse, loading, maintenance]
      - name: temperature
        type: float
        unit: "°C"
      - name: humidity
        type: float
        unit: "%"

link_types:
  - link_type_id: installed_in
    display_name: Installed In
    source_type_id: cnc_machine
    target_type_id: factory_zone
    cardinality: "1:1"
    inverse_name: contains_machine

  - link_type_id: serves
    display_name: Serves
    source_type_id: conveyor
    target_type_id: cnc_machine
    cardinality: "1:N"

  - link_type_id: operates_in
    display_name: Operates In
    source_type_id: agv
    target_type_id: factory_zone
    cardinality: "1:N"

  - link_type_id: transports_to
    display_name: Transports To
    source_type_id: agv
    target_type_id: cnc_machine
    cardinality: "1:N"

actions:
  - action_id: start_program
    display_name: Start CNC Program
    target_type_id: cnc_machine
    parameters:
      - name: program_name
        type: string
        required: true
      - name: feed_override
        type: float
        default_value: 100

  - action_id: emergency_stop
    display_name: Emergency Stop
    target_type_id: cnc_machine
    parameters: []

  - action_id: dispatch_agv
    display_name: Dispatch AGV
    target_type_id: agv
    parameters:
      - name: target_x
        type: float
        required: true
      - name: target_y
        type: float
        required: true
      - name: payload_type
        type: string

functions:
  - function_id: calc_oee
    display_name: Calculate OEE
    inputs:
      - name: machine_id
        type: string
      - name: period_hours
        type: float
    output_type: float
    output_description: "Overall Equipment Effectiveness (0-100%)"

  - function_id: predict_maintenance
    display_name: Predict Maintenance Need
    inputs:
      - name: machine_id
        type: string
    output_type: json
    output_description: "Predicted failure probability and recommended actions"

rules:
  - rule_id: high_temperature
    display_name: High Temperature Alert
    target_type_id: cnc_machine
    conditions:
      - property_name: temperature
        operator: gt
        threshold: 85
    actions:
      - type: emit_alert
        params:
          severity: warning
          title: High Temperature
          message: "Machine temperature exceeds 85°C"
    priority: 15
    cooldown_ms: 60000
    enabled: true

  - rule_id: critical_vibration
    display_name: Critical Vibration
    target_type_id: cnc_machine
    conditions:
      - property_name: vibration_rms
        operator: gt
        threshold: 10
    actions:
      - type: emit_alert
        params:
          severity: critical
          title: Excessive Vibration
          message: "Vibration exceeds safe threshold — possible bearing failure"
      - type: trigger_action
        params:
          action_id: emergency_stop
    priority: 25
    cooldown_ms: 10000
    enabled: true

  - rule_id: agv_low_battery
    display_name: AGV Low Battery
    target_type_id: agv
    conditions:
      - property_name: battery_level
        operator: lt
        threshold: 15
    actions:
      - type: emit_alert
        params:
          severity: warning
          title: AGV Low Battery
          message: "AGV battery below 15%"
    priority: 10
    cooldown_ms: 120000
    enabled: true

workflows:
  - workflow_id: tool_change
    display_name: Tool Change Workflow
    target_type_id: cnc_machine
    steps:
      - step_id: pause_machine
        display_name: Pause Machine
        action_type: emergency_stop
        params: {}
        proceed_condition:
          property_name: status
          expected_value: idle
          timeout_ms: 30000
      - step_id: dispatch_tool_agv
        display_name: Dispatch AGV with New Tool
        action_type: dispatch_agv
        params:
          payload_type: cutting_tool
      - step_id: resume_program
        display_name: Resume CNC Program
        action_type: start_program
        params: {}

spatial_contexts:
  - context_id: factory_floor
    display_name: Factory Floor
    coordinate_frame: enu
    bounds:
      min: [0, 0, 0]
      max: [100, 60, 10]
    representations:
      - layer_id: floor_map
        type: occupancy_grid
        source: maps/factory_floor.pgm
        spatial:
          resolution: 0.05
      - layer_id: factory_bim
        type: mesh
        source: models/factory.glb
        spatial:
          format: gltf
      - layer_id: factory_pointcloud
        type: pointcloud
        source: scans/factory_scan.las
        spatial:
          format: las

edge:
  device_profiles:
    - profile_id: agv_v2
      display_name: Factory AGV v2
      device_type: agv
      urdf_path: urdf/agv_v2.urdf.xacro
      namespace: /agv
      sensors:
        - sensor_id: nav_lidar
          sensor_type: lidar
          connection:
            protocol: ros2_topic
            endpoint: /agv/scan
          data_schema:
            fields: { ranges: "float32[]" }
            frame_id: laser_frame
            frequency_hz: 20
        - sensor_id: safety_lidar
          sensor_type: lidar
          connection:
            protocol: ros2_topic
            endpoint: /agv/safety_scan
          data_schema:
            fields: { ranges: "float32[]" }
            frame_id: safety_laser_frame
            frequency_hz: 20
      actuators:
        - actuator_id: drive
          actuator_type: motor
          command_interface: /agv/cmd_vel
          command_type: geometry_msgs/Twist

  data_connectors:
    - connector_id: cnc_opcua
      display_name: CNC OPC-UA Connection
      protocol: opc_ua
      endpoint: opc.tcp://192.168.1.100:4840
      auth:
        method: basic
      topic_mapping:
        "ns=2;i=1001": cnc_machine.spindle_speed
        "ns=2;i=1002": cnc_machine.spindle_load
        "ns=2;i=1003": cnc_machine.temperature
        "ns=2;i=1004": cnc_machine.vibration_rms
        "ns=2;i=1005": cnc_machine.power_consumption

    - connector_id: env_mqtt
      display_name: Environment Sensors (MQTT)
      protocol: mqtt
      endpoint: mqtt://192.168.1.10:1883
      topic_mapping:
        "factory/zone/+/temperature": factory_zone.temperature
        "factory/zone/+/humidity": factory_zone.humidity
