<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenTwin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>OpenTwin Dashboard</h1>
    <div id="status-bar">
      <span id="connection-status" class="status-disconnected">Disconnected</span>
      <span id="twin-count">Twins: 0</span>
      <span id="alert-count">Alerts: 0</span>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" data-view="twins">Twins</button>
    <button class="nav-btn" data-view="alerts">Alerts</button>
    <button class="nav-btn" data-view="workflows">Workflows</button>
    <button class="nav-btn" data-view="ontology">Ontology</button>
    <button class="nav-btn" data-view="bindings">Bindings</button>
  </nav>

  <main>
    <!-- Twins View -->
    <section id="view-twins" class="view active">
      <div class="toolbar">
        <select id="type-filter"><option value="">All Types</option></select>
        <button id="refresh-twins">Refresh</button>
      </div>
      <div id="twin-list" class="card-grid"></div>
      <div id="twin-detail" class="detail-panel hidden">
        <h3 id="twin-detail-title"></h3>
        <div id="twin-detail-props"></div>
        <div id="twin-detail-spatial"></div>
        <div id="twin-detail-links"></div>
        <div id="twin-detail-timeline"></div>
      </div>
    </section>

    <!-- Alerts View -->
    <section id="view-alerts" class="view hidden">
      <div class="toolbar">
        <select id="alert-severity-filter">
          <option value="">All Severities</option>
          <option value="critical">Critical</option>
          <option value="error">Error</option>
          <option value="warning">Warning</option>
          <option value="info">Info</option>
        </select>
        <select id="alert-status-filter">
          <option value="">All Statuses</option>
          <option value="active">Active</option>
          <option value="acknowledged">Acknowledged</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <table id="alert-table">
        <thead>
          <tr>
            <th>Severity</th>
            <th>Title</th>
            <th>Message</th>
            <th>Twin</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="alert-body"></tbody>
      </table>
    </section>

    <!-- Workflows View -->
    <section id="view-workflows" class="view hidden">
      <h3>Workflow Definitions</h3>
      <div id="workflow-defs"></div>
      <h3>Running Instances</h3>
      <div id="workflow-instances"></div>
    </section>

    <!-- Ontology View -->
    <section id="view-ontology" class="view hidden">
      <h3>Object Types</h3>
      <div id="ontology-types"></div>
      <h3>Link Types</h3>
      <div id="ontology-links"></div>
    </section>

    <!-- Bindings View -->
    <section id="view-bindings" class="view hidden">
      <h3>Ontology Bindings</h3>
      <div id="bindings-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
